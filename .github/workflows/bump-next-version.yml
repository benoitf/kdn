# Called by release.yml (cargo-dist post-announce-jobs) after a release is published.
# Opens an auto-merge PR bumping Cargo.toml to the next minor with a -next suffix.
name: bump-next-version

on:
  workflow_call:
    inputs:
      plan:
        description: "dist release plan (unused, passed by cargo-dist)"
        required: false
        type: string

jobs:
  bump-next-version:
    name: Bump Next Version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          token: ${{ secrets.KAIDEN_BOT_TOKEN }}

      - name: Compute next version
        id: version
        run: |
          RELEASED="${GITHUB_REF_NAME#v}"
          NEXT=$(echo "$RELEASED" | awk -F. '{ printf "%d.%d.0", $1, $2 + 1 }')
          echo "next_version=${NEXT}-next" >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml and Cargo.lock
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.next_version }}"/' Cargo.toml
          cargo update --workspace

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create PR
        run: |
          BRANCH="bump-next-${{ steps.version.outputs.next_version }}"
          git checkout -b "$BRANCH"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${{ steps.version.outputs.next_version }}"
          git push origin "$BRANCH"
          pullRequestUrl=$(gh pr create \
            --title "chore: bump version to ${{ steps.version.outputs.next_version }}" \
            --body "Bump version to \`${{ steps.version.outputs.next_version }}\` after release \`${{ github.ref_name }}\`." \
            --base main \
            --head "$BRANCH")
          echo "📢 Pull request created: ${pullRequestUrl}"
          gh pr ready "${pullRequestUrl}"
          gh pr merge "${pullRequestUrl}" --auto --rebase
        env:
          GH_TOKEN: ${{ secrets.KAIDEN_BOT_TOKEN }}
