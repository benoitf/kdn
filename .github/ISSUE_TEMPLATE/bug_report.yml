name: Bug report
description: Something in kdn does not work as documented
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: kdn version
      description: Output of `kdn --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26.0 / Fedora 42
    validations:
      required: true
  - type: input
    id: kaiden
    attributes:
      label: Kaiden version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. kdn ws ls
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full command output or error message.
      render: shell
    validations:
      required: true
